<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KAS PRO</title>

<style>

body{
font-family:Arial;
background:linear-gradient(90deg,#5f79d6,#6c86e4);
margin:0;
padding:40px;
}

.container{
background:white;
padding:30px;
border-radius:12px;
max-width:1100px;
margin:auto;
}

h2{
margin-top:0;
}

.dashboard{
display:flex;
gap:20px;
margin-bottom:25px;
}

.card{
flex:1;
background:#f1f1f1;
padding:20px;
border-radius:10px;
text-align:center;
}

.card h3{
margin:0;
font-size:16px;
}

.card h1{
margin:5px 0 0 0;
}

.form-row{
display:flex;
gap:10px;
margin-bottom:15px;
}

.form-row input,
.form-row select{
flex:1;
padding:8px;
border:1px solid #ccc;
border-radius:5px;
}

.form-row button{
width:110px;
padding:8px;
cursor:pointer;
}

.section{
margin-top:25px;
}

.anggota-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid #ddd;
}

.anggota-info{
display:flex;
gap:25px;
}

button{
background:#e5e5e5;
border:1px solid #999;
border-radius:5px;
}

.hidden{
display:none;
}

.login-box{
max-width:350px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
}

.login-box input{
width:100%;
padding:10px;
margin-top:10px;
}

.login-box button{
width:100%;
margin-top:10px;
padding:10px;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginSection" class="login-box">

<h2>Login</h2>

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="loginError" style="color:red"></p>

</div>



<!-- APP -->

<div id="app" class="container hidden">

<h2>Dashboard Kas</h2>

<div class="dashboard">

<div class="card">
<h3>Saldo Awal</h3>
<h1 id="saldoAwal">Rp 0</h1>
</div>

<div class="card">
<h3>Total Masuk</h3>
<h1 id="totalMasuk">Rp 0</h1>
</div>

<div class="card">
<h3>Total Keluar</h3>
<h1 id="totalKeluar">Rp 0</h1>
</div>

<div class="card">
<h3>Sisa Kas</h3>
<h1 id="sisaKas">Rp 0</h1>
</div>

</div>



<div class="section">

<h3>Set Saldo Awal</h3>

<div class="form-row">

<input
type="number"
id="inputSaldoAwal"
placeholder="Saldo awal"
/>

<button onclick="setSaldoAwal()">Simpan</button>

<button onclick="hapusSaldoAwal()">Hapus</button>

</div>

</div>



<div class="section">

<h3>Tambah Anggota</h3>

<div class="form-row">
<input type="text" id="inputNamaAnggota" placeholder="Nama anggota">
<button onclick="tambahAnggota()">Tambah</button>
</div>

</div>



<div class="section">

<h3>Pemasukan Kas</h3>

<div class="form-row">

<select id="selectAnggota"></select>

<input type="number" id="inputJumlahKas" placeholder="Jumlah">

<input type="date" id="inputTanggalKas">

<button onclick="tambahKas()">Tambah</button>

</div>

</div>



<div class="section">

<h3>Pengeluaran</h3>

<div class="form-row">

<input type="text" id="inputLokasi" placeholder="Keterangan">

<input type="number" id="inputJumlahKeluar" placeholder="Jumlah">

<input type="date" id="inputTanggalKeluar">

<button onclick="tambahPengeluaran()">Tambah</button>

</div>

</div>



<div class="section">

<h3>Daftar Anggota</h3>

<div id="listAnggota"></div>

</div>

</div>



<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const supabase = createClient(
"https://tizsemvhdyykizevqsbl.supabase.co",
"sb_publishable_ZzxxlCc_IGlHAaeo4OU7Jg_EL5Yhdeq"
)

const formatRupiah=(n)=>new Intl.NumberFormat('id-ID',{
style:'currency',
currency:'IDR',
minimumFractionDigits:0
}).format(n)



document.getElementById('inputTanggalKas').valueAsDate=new Date()
document.getElementById('inputTanggalKeluar').valueAsDate=new Date()



window.login=()=>{

const pass=document.getElementById("password").value

if(pass!=="admin123"){
document.getElementById("loginError").innerText="Password salah"
return
}

document.getElementById("loginSection").style.display="none"
document.getElementById("app").classList.remove("hidden")

loadData()

}



async function loadData(){

const {data:anggota}=await supabase
.from("anggota")
.select("*")
.order("nama")

const {data:trx}=await supabase
.from("transaksi_kas")
.select("*")

const {data:keluar}=await supabase
.from("pengeluaran")
.select("*")

const {data:config}=await supabase
.from("config_kas")
.select("*")



const saldoAwal=config?.[0]?.dana_awal||0

const totalMasuk=(trx||[])
.reduce((sum,r)=>sum+Number(r.jumlah||0),0)

const totalKeluar=(keluar||[])
.reduce((sum,r)=>sum+Number(r.jumlah||0),0)

const sisa=saldoAwal+totalMasuk-totalKeluar



document.getElementById("saldoAwal").innerText=formatRupiah(saldoAwal)
document.getElementById("totalMasuk").innerText=formatRupiah(totalMasuk)
document.getElementById("totalKeluar").innerText=formatRupiah(totalKeluar)
document.getElementById("sisaKas").innerText=formatRupiah(sisa)



const select=document.getElementById("selectAnggota")
select.innerHTML=""

anggota?.forEach(a=>{
select.innerHTML+=`<option value="${a.nama}">${a.nama}</option>`
})



const list=document.getElementById("listAnggota")
list.innerHTML=""



anggota?.forEach(a=>{

const transaksiAnggota=trx.filter(t=>t.nama_anggota===a.nama)

if(transaksiAnggota.length===0){

list.innerHTML+=`
<div class="anggota-item">

<div class="anggota-info">

<span>${a.nama}</span>
<span>-</span>
<span>-</span>

</div>

</div>
`

}else{

transaksiAnggota.forEach(t=>{

list.innerHTML+=`
<div class="anggota-item">

<div class="anggota-info">

<span>${a.nama}</span>
<span>${t.bulan}</span>
<span>${formatRupiah(t.jumlah)}</span>

</div>

<button onclick="hapusKas('${t.id}')">Hapus</button>

</div>
`

})

}

})

}



window.tambahAnggota=async()=>{

const nama=document.getElementById("inputNamaAnggota").value

await supabase.from("anggota").insert({nama})

document.getElementById("inputNamaAnggota").value=""

loadData()

}



window.tambahKas=async()=>{

const nama=document.getElementById("selectAnggota").value
const jumlah=Number(document.getElementById("inputJumlahKas").value)
const tanggal=document.getElementById("inputTanggalKas").value

const bulan=new Date(tanggal).toLocaleString('id-ID',{month:'long'})

await supabase.from("transaksi_kas").insert({
nama_anggota:nama,
jumlah:jumlah,
bulan:bulan
})

document.getElementById("inputJumlahKas").value=""

loadData()

}



window.tambahPengeluaran=async()=>{

const lokasi=document.getElementById("inputLokasi").value
const jumlah=Number(document.getElementById("inputJumlahKeluar").value)
const tanggal=document.getElementById("inputTanggalKeluar").value

await supabase.from("pengeluaran").insert({
lokasi:lokasi,
jumlah:jumlah,
tanggal:tanggal
})

document.getElementById("inputLokasi").value=""
document.getElementById("inputJumlahKeluar").value=""

loadData()

}



window.setSaldoAwal=async()=>{

const jumlah=Number(document.getElementById("inputSaldoAwal").value)

await supabase.from("config_kas").upsert({
id:"1",
dana_awal:jumlah
})

loadData()

}



window.hapusKas=async(id)=>{

if(!confirm("Hapus transaksi?"))return

await supabase
.from("transaksi_kas")
.delete()
.eq("id",id)

loadData()

}

window.hapusSaldoAwal = async () => {

if(!confirm("Hapus saldo awal?")) return

const { error } = await supabase
.from("config_kas")
.delete()
.neq("id", "")

if(error){
alert(error.message)
}else{
loadData()
}

}


supabase
.channel("realtime-kas")
.on("postgres_changes",{event:"*",schema:"public",table:"transaksi_kas"},loadData)
.on("postgres_changes",{event:"*",schema:"public",table:"pengeluaran"},loadData)
.on("postgres_changes",{event:"*",schema:"public",table:"anggota"},loadData)
.subscribe()

</script>

</body>
</html>
