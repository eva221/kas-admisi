<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAS PRO REALTIME</title>

<style>
* {box-sizing: border-box;}
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    overflow: hidden;
    min-height: 80vh;
}

.login-section {
    padding: 60px 40px;
    text-align: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 50vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.login-section h2 {
    color: #333;
    margin-bottom: 30px;
    font-size: 2.5em;
}

.password-input {
    width: 100%;
    max-width: 300px;
    padding: 15px;
    font-size: 18px;
    border: 2px solid #ddd;
    border-radius: 10px;
    margin-right: 10px;
    margin-bottom: 20px;
}

.btn {
    padding: 15px 40px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: bold;
    min-width: 120px;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
}

.app-section {
    padding: 40px;
    /* Hilangkan display: none, gunakan visibility */
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
}

.card.saldo-awal::before {background: #4CAF50;}
.card.total-masuk::before {background: #2196F3;}
.card.total-keluar::before {background: #f44336;}
.card.sisa-kas::before {background: #FF9800;}

.card h3 {
    color: #666;
    margin: 0 0 15px 0;
    font-size: 1.1em;
}

.card .value {
    font-size: 2.5em;
    font-weight: bold;
    margin: 0;
}

.sisa-kas .value {
    font-size: 3.5em;
    color: #FF9800;
}

.admin-panel {
    background: #e3f2fd;
    padding: 30px;
    border-radius: 15px;
    margin-top: 30px;
    border-left: 5px solid #2196F3;
}

.admin-panel h3 {
    color: #1976D2;
    margin-top: 0;
    margin-bottom: 20px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 15px;
    align-items: end;
    margin-bottom: 25px;
    padding: 20px;
    background: white;
    border-radius: 12px;
    border: 2px solid #e1f5fe;
}

.form-row.pemasukan {border-color: #bbdefb;}
.form-row.pengeluaran {border-color: #ffcdd2;}
.form-row.saldo-awal {border-color: #c8e6c9;}
.form-row.anggota {border-color: #f3e5f5;}

.form-row label {
    font-weight: bold;
    color: #1976D2;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
}

.form-row input, .form-row select {
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

.hidden {
    display: none !important;
}

#app.hidden {
    display: none !important;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #666;
}

@media (max-width: 768px) {
    .form-row {
        grid-template-columns: 1fr;
        gap: 10px;
    }
    .password-input {width: 100%; margin-bottom: 15px;}
    body {padding: 10px;}
}
</style>
</head>

<body>
<div class="container">
    <!-- Login Section - SELALU TERLIHAT PERTAMA -->
    <div id="loginSection" class="login-section">
        <h2>🔐 LOGIN KAS PRO</h2>
        <p style="color: #666; margin-bottom: 30px;">Masukkan password untuk mengakses dashboard</p>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
            <input type="password" id="password" class="password-input" placeholder="Masukkan password admin...">
            <button id="loginBtn" class="btn btn-primary" onclick="login()">🚀 Masuk</button>
            <div id="loginError" style="color: #f44336; font-weight: bold; display: none;"></div>
        </div>
    </div>

    <!-- App Section - AWALNYA DIHIDDEN -->
    <div id="app" class="app-section hidden">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1>📊 DASHBOARD KAS</h1>
            <div id="loading" class="loading" style="display: none;">
                🔄 Memuat data...
            </div>
        </div>
        
        <div class="dashboard" id="dashboard" style="display: none;">
            <div class="card saldo-awal">
                <h3>💰 Saldo Awal</h3>
                <div class="value" id="saldoAwal">Rp 0</div>
            </div>
            <div class="card total-masuk">
                <h3>📈 Total Masuk</h3>
                <div class="value" id="totalMasuk">Rp 0</div>
            </div>
            <div class="card total-keluar">
                <h3>📉 Total Keluar</h3>
                <div class="value" id="totalKeluar">Rp 0</div>
            </div>
            <div class="card sisa-kas">
                <h3>🎯 Sisa Kas</h3>
                <div class="value" id="sisaKas">Rp 0</div>
            </div>
        </div>

        <div id="adminPanel" class="admin-panel hidden">
            <h3>⚙️ PANEL ADMIN</h3>
            
            <div class="form-row saldo-awal">
                <label>💰 Saldo Awal</label>
                <input id="inputSaldoAwal" type="number" placeholder="0">
                <div></div>
                <button class="btn btn-primary" onclick="setSaldoAwal()">💾 Simpan</button>
            </div>

            <div class="form-row anggota">
                <label>👥 Nama Anggota</label>
                <input id="inputNamaAnggota" placeholder="John Doe">
                <div></div>
                <button class="btn btn-primary" onclick="tambahAnggota()">➕ Tambah</button>
            </div>

            <div class="form-row pemasukan">
                <label>👤 Nama</label>
                <label>💰 Nominal</label>
                <label>📅 Tanggal</label>
                <select id="selectAnggota"></select>
                <input id="inputJumlahKas" type="number" placeholder="50000">
                <input id="inputTanggalKas" type="date">
                <button class="btn btn-primary" onclick="tambahKas()">💰 Pemasukan</button>
            </div>

            <div class="form-row pengeluaran">
                <label>📍 Keterangan</label>
                <label>💸 Nominal</label>
                <label>📅 Tanggal</label>
                <input id="inputLokasi" placeholder="Belanja bulanan">
                <input id="inputJumlahKeluar" type="number" placeholder="25000">
                <input id="inputTanggalKeluar" type="date">
                <button class="btn btn-primary" onclick="tambahPengeluaran()">💸 Pengeluaran</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const supabase = createClient(
    "https://tizsemvhdyykizevqsbl.supabase.co",
    "sb_publishable_ZzxxlCc_IGlHAaeo4OU7Jg_EL5Yhdeq"
)

let role = "anggota"

// Elements
const loginSection = document.getElementById('loginSection')
const app = document.getElementById('app')
const adminPanel = document.getElementById('adminPanel')
const password = document.getElementById('password')
const loginBtn = document.getElementById('loginBtn')
const loginError = document.getElementById('loginError')
const dashboard = document.getElementById('dashboard')
const loading = document.getElementById('loading')

// Format Rupiah
const formatRupiah = (angka) => {
    return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0
    }).format(angka)
}

// Set tanggal hari ini
document.getElementById('inputTanggalKas').valueAsDate = new Date()
document.getElementById('inputTanggalKeluar').valueAsDate = new Date()

window.login = async () => {
    const pass = password.value.trim()
    loginError.style.display = 'none'
    loginBtn.disabled = true
    loginBtn.textContent = '🔄 Memeriksa...'

    try {
        if (pass === "admin123") {
            role = "admin"
        } else if (!pass) {
            throw new Error("Password harus diisi!")
        } else {
            throw new Error("Password salah!")
        }

        // Sembunyikan login, tampilkan app
        loginSection.style.display = 'none'
        app.classList.remove('hidden')
        
        // Loading
        loading.style.display = 'block'
        dashboard.style.display = 'none'

        // Load data
        await loadData()
        
        // Show dashboard
        loading.style.display = 'none'
        dashboard.style.display = 'grid'

        if (role === "admin") {
            adminPanel.classList.remove('hidden')
        }

        password.value = ''
        
    } catch (error) {
        loginError.textContent = `❌ ${error.message}`
        loginError.style.display = 'block'
    } finally {
        loginBtn.disabled = false
        loginBtn.textContent = '🚀 Masuk'
    }
}

// Enter key support
password.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') login()
})

// Load data utama
async function loadData() {
    try {
        // Anggota
        const { data: anggota } = await supabase.from("anggota").select("*")
        const selectAnggota = document.getElementById('selectAnggota')
        selectAnggota.innerHTML = 
            (anggota || []).map(a => `<option value="${a.nama}">${a.nama}</option>`).join("")
        
        if (!anggota?.length) {
            selectAnggota.innerHTML = '<option value="">Tidak ada anggota, tambah dulu!</option>'
        }

        // Config saldo awal
        const { data: configList } = await supabase.from("config_kas").select("*")
        const config = configList?.[0] || { dana_awal: 0 }
        const saldoAwalValue = config.dana_awal || 0

        // Total pemasukan
        const { data: trx } = await supabase.from("transaksi_kas").select("jumlah")
        const totalMasukValue = (trx || []).reduce((sum, r) => sum + Number(r.jumlah || 0), 0)

        // Total pengeluaran
        const { data: pengeluaran } = await supabase.from("pengeluaran").select("jumlah")
        const totalKeluarValue = (pengeluaran || []).reduce((sum, r) => sum + Number(r.jumlah || 0), 0)

        const sisaKasValue = saldoAwalValue + totalMasukValue - totalKeluarValue

        // Update UI
        document.getElementById("saldoAwal").innerText = formatRupiah(saldoAwalValue)
        document.getElementById("totalMasuk").innerText = formatRupiah(totalMasukValue)
        document.getElementById("totalKeluar").innerText = formatRupiah(totalKeluarValue)
        document.getElementById("sisaKas").innerText = formatRupiah(sisaKasValue)

    } catch (error) {
        console.error('Error loading data:', error)
        alert('❌ Error loading data: ' + error.message)
    }
}

// Admin Actions - sama seperti sebelumnya
window.setSaldoAwal = async () => {
    if (role !== "admin") return alert("❌ Admin only!")
    
    const jumlah = Number(document.getElementById('inputSaldoAwal').value)
    if (!jumlah || jumlah < 0) return alert("⚠️ Masukkan jumlah yang valid!")

    try {
        await supabase.from("config_kas").upsert({ dana_awal: jumlah })
        alert("✅ Saldo awal disimpan!")
        document.getElementById('inputSaldoAwal').value = ''
        loadData()
    } catch (error) {
        alert("❌ Error: " + error.message)
    }
}

window.tambahAnggota = async () => {
    const nama = document.getElementById('inputNamaAnggota').value.trim()
    if (!nama) return alert("⚠️ Nama anggota harus diisi!")

    try {
        await supabase.from("anggota").insert({ nama })
        alert("✅ Anggota ditambahkan!")
        document.getElementById('inputNamaAnggota').value = ''
        loadData()
    } catch (error) {
        alert("❌ Error: " + error.message)
    }
}

window.tambahKas = async () => {
    const nama = document.getElementById('selectAnggota').value
    const jumlah = Number(document.getElementById('inputJumlahKas').value)
    const tanggal = document.getElementById('inputTanggalKas').value
    
    if (!nama) return alert("⚠️ Pilih nama anggota!")
    if (!jumlah || jumlah <= 0) return alert("⚠️ Masukkan nominal yang valid!")
    if (!tanggal) return alert("⚠️ Pilih tanggal!")

    try {
        await supabase.from("transaksi_kas").insert({
            nama_anggota: nama,
            jumlah: jumlah,
            tanggal: tanggal,
            bulan: new Date(tanggal).getMonth() + 1,
            tahun: new Date(tanggal).getFullYear()
        })
        alert(`✅ Pemasukan Rp ${formatRupiah(jumlah)} dari ${nama} (${tanggal}) berhasil!`)
        
        document.getElementById('inputJumlahKas').value = ''
        document.getElementById('inputTanggalKas').valueAsDate = new Date()
        loadData()
    } catch (error) {
        alert("❌ Error: " + error.message)
    }
}

window.tambahPengeluaran = async () => {
    const lokasi = document.getElementById('inputLokasi').value.trim()
    const jumlah = Number(document.getElementById('inputJumlahKeluar').value)
    const tanggal = document.getElementById('inputTanggalKeluar').value
    
    if (!lokasi) return alert("⚠️ Isi keterangan pengeluaran!")
    if (!jumlah || jumlah <= 0) return alert("⚠️ Masukkan jumlah yang valid!")
    if (!tanggal) return alert("⚠️ Pilih tanggal!")

    try {
        await supabase.from("pengeluaran").insert({
            lokasi: lokasi,
            jumlah: jumlah,
            tanggal: tanggal
        })
        alert(`✅ Pengeluaran Rp ${formatRupiah(jumlah)} (${lokasi}) (${tanggal}) berhasil!`)
        
        document.getElementById('inputLokasi').value = ''
        document.getElementById('inputJumlahKeluar').value = ''
        document.getElementById('inputTanggalKeluar').valueAsDate = new Date()
        loadData()
    } catch (error) {
        alert("❌ Error: " + error.message)
    }
}

// Realtime
supabase.channel("realtime-kas")
    .on("postgres_changes", { event: "*", schema: "public", table: "transaksi_kas" }, loadData)
    .on("postgres_changes", { event: "*", schema
