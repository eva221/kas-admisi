<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAS PRO REALTIME</title>

<style>
*{box-sizing:border-box}
body{
font-family:'Segoe UI',Tahoma;
margin:0;
padding:20px;
background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh
}

.container{
max-width:1200px;
margin:auto;
background:white;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,0.1);
overflow:hidden
}

.login-section{
padding:60px 40px;
text-align:center;
background:linear-gradient(135deg,#f5f7fa,#c3cfe2)
}

.password-input{
width:100%;
max-width:300px;
padding:15px;
font-size:18px;
border:2px solid #ddd;
border-radius:10px
}

.btn{
padding:15px 40px;
font-size:16px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold
}

.btn-primary{
background:linear-gradient(135deg,#667eea,#764ba2);
color:white
}

.app-section{padding:40px}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px
}

.card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
text-align:center
}

.value{
font-size:2.5em;
font-weight:bold
}

.admin-panel{
background:#e3f2fd;
padding:30px;
border-radius:15px;
margin-top:30px
}

.form-row{
display:grid;
grid-template-columns:1fr 1fr 1fr auto;
gap:15px;
align-items:end;
margin-bottom:20px;
padding:20px;
background:white;
border-radius:10px
}

.form-row input,.form-row select{
padding:10px;
border:2px solid #ddd;
border-radius:8px
}

.hidden{display:none}
</style>
</head>

<body>

<div class="container">

<div id="loginSection" class="login-section">
<h2>🔐 LOGIN KAS</h2>

<input type="password" id="password" class="password-input" placeholder="Password admin">

<br><br>

<button class="btn btn-primary" onclick="login()">Masuk</button>

<div id="loginError" style="color:red;margin-top:10px"></div>

</div>


<div id="app" class="app-section hidden">

<h1>📊 KAS ATOMIC</h1>

<div id="dashboard" class="dashboard">

<div class="card">
<h3>Saldo Awal</h3>
<div id="saldoAwal" class="value">Rp 0</div>
</div>

<div class="card">
<h3>Total Masuk</h3>
<div id="totalMasuk" class="value">Rp 0</div>
</div>

<div class="card">
<h3>Total Keluar</h3>
<div id="totalKeluar" class="value">Rp 0</div>
</div>

<div class="card">
<h3>Sisa Kas</h3>
<div id="sisaKas" class="value">Rp 0</div>
</div>

</div>


<div id="adminPanel" class="admin-panel hidden">

<h3>Panel Admin</h3>

<div class="form-row">
<input id="inputSaldoAwal" type="number" placeholder="Saldo Awal">
<div></div>
<div></div>
<button onclick="setSaldoAwal()">Simpan</button>
</div>


<div class="form-row">
<input id="inputNamaAnggota" placeholder="Nama anggota">
<div></div>
<div></div>
<button onclick="tambahAnggota()">Tambah</button>
</div>


<div class="form-row">
<select id="selectAnggota"></select>
<input id="inputJumlahKas" type="number" placeholder="Nominal">
<input id="inputTanggalKas" type="date">
<button onclick="tambahKas()">Pemasukan</button>
</div>


<div class="form-row">
<input id="inputLokasi" placeholder="Keterangan">
<input id="inputJumlahKeluar" type="number">
<input id="inputTanggalKeluar" type="date">
<button onclick="tambahPengeluaran()">Pengeluaran</button>
</div>

</div>

</div>

</div>

<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const supabase = createClient(
"https://tizsemvhdyykizevqsbl.supabase.co",
"sb_publishable_ZzxxlCc_IGlHAaeo4OU7Jg_EL5Yhdeq"
)

let role="anggota"

const formatRupiah=(n)=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(n)

document.getElementById('inputTanggalKas').valueAsDate=new Date()
document.getElementById('inputTanggalKeluar').valueAsDate=new Date()


window.login=async()=>{

const pass=document.getElementById('password').value

if(pass==="admin123"){
role="admin"
}else{
document.getElementById("loginError").innerText="Password salah"
return
}

document.getElementById("loginSection").style.display="none"
document.getElementById("app").classList.remove("hidden")

if(role==="admin"){
document.getElementById("adminPanel").classList.remove("hidden")
}

loadData()

}


async function loadData(){

try{

const {data:anggota}=await supabase.from("anggota").select("*")

const select=document.getElementById("selectAnggota")

select.innerHTML=(anggota||[]).map(a=>`<option value="${a.nama}">${a.nama}</option>`).join("")

const {data:configList}=await supabase.from("config_kas").select("*")

const saldoAwal=configList?.[0]?.dana_awal||0

const {data:trx}=await supabase.from("transaksi_kas").select("jumlah")

const totalMasuk=(trx||[]).reduce((s,r)=>s+Number(r.jumlah||0),0)

const {data:keluar}=await supabase.from("pengeluaran").select("jumlah")

const totalKeluar=(keluar||[]).reduce((s,r)=>s+Number(r.jumlah||0),0)

const sisa=saldoAwal+totalMasuk-totalKeluar

document.getElementById("saldoAwal").innerText=formatRupiah(saldoAwal)
document.getElementById("totalMasuk").innerText=formatRupiah(totalMasuk)
document.getElementById("totalKeluar").innerText=formatRupiah(totalKeluar)
document.getElementById("sisaKas").innerText=formatRupiah(sisa)

}catch(err){

alert("Error load data "+err.message)

}

}



window.setSaldoAwal=async()=>{

const jumlah=Number(document.getElementById("inputSaldoAwal").value)

await supabase.from("config_kas").upsert({dana_awal:jumlah})

loadData()

}


window.tambahAnggota=async()=>{

const nama=document.getElementById("inputNamaAnggota").value

await supabase.from("anggota").insert({nama})

document.getElementById("inputNamaAnggota").value=""

loadData()

}


window.tambahKas=async()=>{

const nama=document.getElementById("selectAnggota").value
const jumlah=Number(document.getElementById("inputJumlahKas").value)
const tanggal=document.getElementById("inputTanggalKas").value

await supabase.from("transaksi_kas").insert({
nama_anggota:nama,
jumlah:jumlah,
tanggal:tanggal
})

document.getElementById("inputJumlahKas").value=""

loadData()

}


window.tambahPengeluaran=async()=>{

const lokasi=document.getElementById("inputLokasi").value
const jumlah=Number(document.getElementById("inputJumlahKeluar").value)
const tanggal=document.getElementById("inputTanggalKeluar").value

await supabase.from("pengeluaran").insert({
lokasi:lokasi,
jumlah:jumlah,
tanggal:tanggal
})

document.getElementById("inputLokasi").value=""
document.getElementById("inputJumlahKeluar").value=""

loadData()

}


supabase
.channel("realtime-kas")
.on("postgres_changes",{event:"*",schema:"public",table:"transaksi_kas"},()=>loadData())
.on("postgres_changes",{event:"*",schema:"public",table:"pengeluaran"},()=>loadData())
.on("postgres_changes",{event:"*",schema:"public",table:"anggota"},()=>loadData())
.on("postgres_changes",{event:"*",schema:"public",table:"config_kas"},()=>loadData())
.subscribe()

</script>

</body>
</html>
