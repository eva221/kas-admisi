<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>KAS PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:linear-gradient(90deg,#5f79d6,#6c86e4);
margin:0;
padding:40px;
}

.container{
background:white;
padding:30px;
border-radius:10px;
max-width:1100px;
margin:auto;
}

.dashboard{
display:flex;
gap:20px;
margin-bottom:25px;
}

.card{
flex:1;
background:#f2f2f2;
padding:20px;
border-radius:8px;
text-align:center;
}

.card h3{margin:0}
.card h1{margin:5px}

.form-row{
display:flex;
gap:10px;
margin-bottom:15px;
}

.form-row input,
.form-row select{
flex:1;
padding:8px;
}

.form-row button{
width:110px;
}

.section{
margin-top:25px;
}

.anggota-item{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #ddd;
}

.hidden{
display:none;
}

.login{
max-width:350px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
}

.login input{
width:100%;
padding:10px;
margin-top:10px;
}

.login button{
width:100%;
padding:10px;
margin-top:10px;
}

canvas{
margin-top:30px;
}

</style>
</head>

<body>

<div id="loginSection" class="login">

<h2>Login</h2>

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="loginError" style="color:red"></p>

</div>


<div id="app" class="container hidden">

<h2>Dashboard Kas</h2>

<div class="dashboard">

<div class="card">
<h3>Saldo Awal</h3>
<h1 id="saldoAwal">Rp0</h1>
</div>

<div class="card">
<h3>Total Masuk</h3>
<h1 id="totalMasuk">Rp0</h1>
</div>

<div class="card">
<h3>Total Keluar</h3>
<h1 id="totalKeluar">Rp0</h1>
</div>

<div class="card">
<h3>Sisa Kas</h3>
<h1 id="sisaKas">Rp0</h1>
</div>

</div>


<div class="section">

<h3>Set Saldo Awal</h3>

<div class="form-row">
<input type="number" id="inputSaldoAwal" placeholder="Saldo awal">
<button onclick="setSaldoAwal()">Simpan</button>
<button onclick="hapusSaldoAwal()">Hapus</button>
</div>

</div>


<div class="section">

<h3>Tambah Anggota</h3>

<div class="form-row">
<input type="text" id="inputNamaAnggota" placeholder="Nama anggota">
<button onclick="tambahAnggota()">Tambah</button>
</div>

</div>


<div class="section">

<h3>Pemasukan Kas</h3>

<div class="form-row">

<select id="selectAnggota"></select>

<input type="number" id="inputJumlahKas" placeholder="Jumlah">

<input type="date" id="inputTanggalKas">

<button onclick="tambahKas()">Tambah</button>

</div>

</div>


<div class="section">

<h3>Pengeluaran</h3>

<div class="form-row">

<input type="text" id="inputLokasi" placeholder="Keterangan">

<input type="number" id="inputJumlahKeluar" placeholder="Jumlah">

<input type="date" id="inputTanggalKeluar">

<button onclick="tambahPengeluaran()">Tambah</button>

</div>

</div>


<div class="section">

<h3>Filter Bulan</h3>

<select id="filterBulan" onchange="loadData()">
<option value="">Semua</option>
<option value="Januari">Januari</option>
<option value="Februari">Februari</option>
<option value="Maret">Maret</option>
<option value="April">April</option>
<option value="Mei">Mei</option>
<option value="Juni">Juni</option>
<option value="Juli">Juli</option>
<option value="Agustus">Agustus</option>
<option value="September">September</option>
<option value="Oktober">Oktober</option>
<option value="November">November</option>
<option value="Desember">Desember</option>
</select>

</div>


<div class="section">

<h3>Daftar Anggota</h3>
<div id="listAnggota"></div>

</div>


<canvas id="kasChart"></canvas>

</div>



<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const supabase = createClient(
"https://tizsemvhdyykizevqsbl.supabase.co",
"sb_publishable_ZzxxlCc_IGlHAaeo4OU7Jg_EL5Yhdeq"
)

let chart

const formatRupiah=(n)=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(n)

document.getElementById("inputTanggalKas").valueAsDate=new Date()
document.getElementById("inputTanggalKeluar").valueAsDate=new Date()

window.login=()=>{

const pass=document.getElementById("password").value

if(pass!=="admin123"){
document.getElementById("loginError").innerText="Password salah"
return
}

document.getElementById("loginSection").style.display="none"
document.getElementById("app").classList.remove("hidden")

loadData()

}



async function loadData(){

const bulanFilter=document.getElementById("filterBulan").value

const {data:anggota}=await supabase.from("anggota").select("*")
const {data:trx}=await supabase.from("transaksi_kas").select("*")
const {data:keluar}=await supabase.from("pengeluaran").select("*")
const {data:config}=await supabase.from("config_kas").select("*")

const saldoAwal=config?.[0]?.dana_awal||0

let transaksi=trx

if(bulanFilter){
transaksi=trx.filter(t=>t.bulan===bulanFilter)
}

const totalMasuk=transaksi.reduce((s,r)=>s+Number(r.jumlah),0)
const totalKeluar=(keluar||[]).reduce((s,r)=>s+Number(r.jumlah),0)

const sisa=saldoAwal+totalMasuk-totalKeluar

document.getElementById("saldoAwal").innerText=formatRupiah(saldoAwal)
document.getElementById("totalMasuk").innerText=formatRupiah(totalMasuk)
document.getElementById("totalKeluar").innerText=formatRupiah(totalKeluar)
document.getElementById("sisaKas").innerText=formatRupiah(sisa)


const select=document.getElementById("selectAnggota")
select.innerHTML=""
anggota.forEach(a=>{
select.innerHTML+=`<option value="${a.nama}">${a.nama}</option>`
})


const list=document.getElementById("listAnggota")
list.innerHTML=""

anggota.forEach(a=>{

const bayar=transaksi.filter(t=>t.nama_anggota===a.nama)

bayar.forEach(t=>{

list.innerHTML+=`
<div class="anggota-item">

<span>${a.nama}</span>
<span>${t.bulan}</span>
<span>${formatRupiah(t.jumlah)}</span>

<button onclick="hapusKas('${t.id}')">Hapus</button>

</div>
`

})

})


renderChart(totalMasuk,totalKeluar)

}



function renderChart(masuk,keluar){

if(chart) chart.destroy()

chart=new Chart(document.getElementById("kasChart"),{
type:"bar",
data:{
labels:["Kas Masuk","Kas Keluar"],
datasets:[{
data:[masuk,keluar]
}]
}
})

}



window.tambahAnggota=async()=>{

const nama=document.getElementById("inputNamaAnggota").value

await supabase.from("anggota").insert({nama})

loadData()

}


window.tambahKas=async()=>{

const nama=document.getElementById("selectAnggota").value
const jumlah=document.getElementById("inputJumlahKas").value
const tanggal=document.getElementById("inputTanggalKas").value

const bulan=new Date(tanggal).toLocaleString("id-ID",{month:"long"})

await supabase.from("transaksi_kas").insert({
nama_anggota:nama,
jumlah:jumlah,
bulan:bulan
})

loadData()

}


window.tambahPengeluaran=async()=>{

const lokasi=document.getElementById("inputLokasi").value
const jumlah=document.getElementById("inputJumlahKeluar").value
const tanggal=document.getElementById("inputTanggalKeluar").value

await supabase.from("pengeluaran").insert({
lokasi:lokasi,
jumlah:jumlah,
tanggal:tanggal
})

loadData()

}


window.setSaldoAwal=async()=>{

const jumlah=document.getElementById("inputSaldoAwal").value

await supabase.from("config_kas").upsert({
id:1,
dana_awal:jumlah
})

loadData()

}


window.hapusSaldoAwal=async()=>{

await supabase.from("config_kas").delete().eq("id",1)

loadData()

}


window.hapusKas=async(id)=>{

if(!confirm("hapus transaksi?")) return

await supabase.from("transaksi_kas").delete().eq("id",id)

loadData()

}

</script>

</body>
</html>
