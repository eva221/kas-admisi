<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAS PRO REALTIME</title>

<style>
body{
font-family:Arial;
background:#667eea;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
background:white;
border-radius:10px;
padding:30px;
}

.hidden{
display:none;
}

.dashboard{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:30px;
}

.card{
background:#f3f3f3;
padding:20px;
border-radius:10px;
text-align:center;
}

.value{
font-size:28px;
font-weight:bold;
}

.form-row{
display:grid;
grid-template-columns:1fr 1fr 1fr auto;
gap:10px;
margin-bottom:15px;
}

input,select{
padding:10px;
}

button{
padding:10px 15px;
cursor:pointer;
}

.anggota-list{
margin-top:20px;
padding:15px;
background:#f7f7f7;
border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<div id="loginSection">

<h2>Login Kas</h2>

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="loginError" style="color:red"></div>

</div>


<div id="app" class="hidden">

<h2>Dashboard Kas</h2>

<div class="dashboard">

<div class="card">
Saldo Awal
<div id="saldoAwal" class="value">Rp 0</div>
</div>

<div class="card">
Total Masuk
<div id="totalMasuk" class="value">Rp 0</div>
</div>

<div class="card">
Total Keluar
<div id="totalKeluar" class="value">Rp 0</div>
</div>

<div class="card">
Sisa Kas
<div id="sisaKas" class="value">Rp 0</div>
</div>

</div>


<div id="adminPanel" class="hidden">

<h3>Set Saldo Awal</h3>

<div class="form-row">
<input id="inputSaldoAwal" type="number" placeholder="Saldo awal">
<div></div>
<div></div>
<button onclick="setSaldoAwal()">Simpan</button>
</div>


<h3>Tambah Anggota</h3>

<div class="form-row">
<input id="inputNamaAnggota" placeholder="Nama anggota">
<div></div>
<div></div>
<button onclick="tambahAnggota()">Tambah</button>
</div>


<h3>Pemasukan Kas</h3>

<div class="form-row">

<select id="selectAnggota"></select>

<input id="inputJumlahKas" type="number" placeholder="Jumlah">

<input id="inputTanggalKas" type="date">

<button onclick="tambahKas()">Tambah</button>

</div>


<h3>Pengeluaran</h3>

<div class="form-row">

<input id="inputLokasi" placeholder="Keterangan">

<input id="inputJumlahKeluar" type="number">

<input id="inputTanggalKeluar" type="date">

<button onclick="tambahPengeluaran()">Tambah</button>

</div>

</div>


<div class="anggota-list">

<h3>Daftar Anggota</h3>

<ul id="listAnggota"></ul>

</div>


</div>

</div>



<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const supabase = createClient(
"https://tizsemvhdyykizevqsbl.supabase.co",
"sb_publishable_ZzxxlCc_IGlHAaeo4OU7Jg_EL5Yhdeq"
)

let role="anggota"


const formatRupiah=(n)=>new Intl.NumberFormat('id-ID',{
style:'currency',
currency:'IDR',
minimumFractionDigits:0
}).format(n)



document.getElementById('inputTanggalKas').valueAsDate=new Date()
document.getElementById('inputTanggalKeluar').valueAsDate=new Date()



window.login=async()=>{

const pass=document.getElementById("password").value

if(pass==="admin123"){
role="admin"
}else{
document.getElementById("loginError").innerText="Password salah"
return
}

document.getElementById("loginSection").style.display="none"

document.getElementById("app").classList.remove("hidden")

if(role==="admin"){
document.getElementById("adminPanel").classList.remove("hidden")
}

loadData()

}



async function loadData(){

// ambil anggota
const {data:anggota}=await supabase
.from("anggota")
.select("*")
.order("nama")

const select=document.getElementById("selectAnggota")
const list=document.getElementById("listAnggota")

select.innerHTML=""
list.innerHTML=""

anggota?.forEach(a=>{

select.innerHTML+=`<option value="${a.nama}">${a.nama}</option>`

list.innerHTML+=`<li>${a.nama}</li>`

})


// saldo awal
const {data:config}=await supabase
.from("config_kas")
.select("*")

const saldoAwal=config?.[0]?.dana_awal||0


// total masuk
const {data:trx}=await supabase
.from("transaksi_kas")
.select("jumlah")

const totalMasuk=(trx||[])
.reduce((sum,r)=>sum+Number(r.jumlah||0),0)


// total keluar
const {data:keluar}=await supabase
.from("pengeluaran")
.select("jumlah")

const totalKeluar=(keluar||[])
.reduce((sum,r)=>sum+Number(r.jumlah||0),0)


const sisa=saldoAwal+totalMasuk-totalKeluar


document.getElementById("saldoAwal").innerText=formatRupiah(saldoAwal)
document.getElementById("totalMasuk").innerText=formatRupiah(totalMasuk)
document.getElementById("totalKeluar").innerText=formatRupiah(totalKeluar)
document.getElementById("sisaKas").innerText=formatRupiah(sisa)

}




window.tambahAnggota=async()=>{

const nama=document.getElementById("inputNamaAnggota").value

const {error}=await supabase
.from("anggota")
.insert({nama})

if(error){
alert(error.message)
return
}

document.getElementById("inputNamaAnggota").value=""

loadData()

}



window.tambahKas=async()=>{

const nama=document.getElementById("selectAnggota").value

const jumlah=Number(document.getElementById("inputJumlahKas").value)

const tanggal=document.getElementById("inputTanggalKas").value

const bulan=new Date(tanggal)
.toLocaleString('id-ID',{month:'long'})


const {error}=await supabase
.from("transaksi_kas")
.insert({
nama_anggota:nama,
jumlah:jumlah,
bulan:bulan
})

if(error){
alert(error.message)
return
}

document.getElementById("inputJumlahKas").value=""

loadData()

}



window.tambahPengeluaran=async()=>{

const lokasi=document.getElementById("inputLokasi").value

const jumlah=Number(document.getElementById("inputJumlahKeluar").value)

const tanggal=document.getElementById("inputTanggalKeluar").value


const {error}=await supabase
.from("pengeluaran")
.insert({
lokasi:lokasi,
jumlah:jumlah,
tanggal:tanggal
})

if(error){
alert(error.message)
return
}

document.getElementById("inputLokasi").value=""
document.getElementById("inputJumlahKeluar").value=""

loadData()

}



window.setSaldoAwal=async()=>{

const jumlah=Number(document.getElementById("inputSaldoAwal").value)

const {error}=await supabase
.from("config_kas")
.upsert({dana_awal:jumlah})

if(error){
alert(error.message)
return
}

loadData()

}



// realtime update
supabase
.channel("realtime-kas")

.on("postgres_changes",{event:"*",schema:"public",table:"transaksi_kas"},loadData)

.on("postgres_changes",{event:"*",schema:"public",table:"pengeluaran"},loadData)

.on("postgres_changes",{event:"*",schema:"public",table:"anggota"},loadData)

.on("postgres_changes",{event:"*",schema:"public",table:"config_kas"},loadData)

.subscribe()


</script>

</body>
</html>
