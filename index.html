<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAS PRO REALTIME</title>

<style>
* {box-sizing: border-box;}
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    overflow: hidden;
}

.login-section {
    padding: 40px;
    text-align: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
}

.login-section h2 {
    color: #333;
    margin-bottom: 30px;
    font-size: 2.5em;
}

.password-input {
    width: 300px;
    padding: 15px;
    font-size: 18px;
    border: 2px solid #ddd;
    border-radius: 10px;
    margin-right: 10px;
}

.btn {
    padding: 15px 30px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: bold;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
}

.app-section {
    padding: 40px;
    display: none;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
}

.card.saldo-awal::before {background: #4CAF50;}
.card.total-masuk::before {background: #2196F3;}
.card.total-keluar::before {background: #f44336;}
.card.sisa-kas::before {background: #FF9800;}

.card h3 {
    color: #666;
    margin: 0 0 15px 0;
    font-size: 1.1em;
}

.card .value {
    font-size: 2.5em;
    font-weight: bold;
    margin: 0;
}

.sisa-kas .value {
    font-size: 3.5em;
    color: #FF9800;
}

.admin-panel {
    background: #e3f2fd;
    padding: 30px;
    border-radius: 15px;
    margin-top: 30px;
    border-left: 5px solid #2196F3;
}

.admin-panel h3 {
    color: #1976D2;
    margin-top: 0;
    margin-bottom: 20px;
}

.form-group {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.form-group input, .form-group select {
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    min-width: 200px;
}

.hidden {display: none !important;}

@media (max-width: 768px) {
    .form-group {flex-direction: column; align-items: stretch;}
    .form-group input, .form-group select {min-width: auto;}
    .password-input {width: 100%; margin-bottom: 15px;}
}
</style>
</head>

<body>
<div class="container">
    <div class="login-section" id="loginSection">
        <h2>🔐 LOGIN KAS PRO</h2>
        <div style="display: flex; justify-content: center; flex-wrap: wrap;">
            <input type="password" id="password" class="password-input" placeholder="Masukkan password...">
            <button class="btn btn-primary" onclick="login()">Login</button>
        </div>
    </div>

    <div id="app" class="app-section hidden">
        <h1 style="text-align: center; color: #333; margin-bottom: 40px;">📊 DASHBOARD KAS</h1>
        
        <div class="dashboard">
            <div class="card saldo-awal">
                <h3>💰 Saldo Awal</h3>
                <div class="value" id="saldoAwal">Rp 0</div>
            </div>
            <div class="card total-masuk">
                <h3>📈 Total Masuk</h3>
                <div class="value" id="totalMasuk">Rp 0</div>
            </div>
            <div class="card total-keluar">
                <h3>📉 Total Keluar</h3>
                <div class="value" id="totalKeluar">Rp 0</div>
            </div>
            <div class="card sisa-kas">
                <h3>🎯 Sisa Kas</h3>
                <div class="value" id="sisaKas">Rp 0</div>
            </div>
        </div>

        <div id="adminPanel" class="admin-panel hidden">
            <h3>⚙️ PANEL ADMIN</h3>
            
            <div class="form-group">
                <h4>Set Saldo Awal</h4>
                <input id="inputSaldoAwal" type="number" placeholder="Masukkan saldo awal">
                <button class="btn btn-primary" onclick="setSaldoAwal()">💾 Simpan</button>
            </div>

            <div class="form-group">
                <h4>Tambah Anggota</h4>
                <input id="inputNamaAnggota" placeholder="Nama anggota">
                <button class="btn btn-primary" onclick="tambahAnggota()">➕ Tambah</button>
            </div>

            <div class="form-group">
                <h4>Tambah Pemasukan</h4>
                <select id="selectAnggota"></select>
                <input id="inputJumlahKas" type="number" placeholder="Jumlah">
                <button class="btn btn-primary" onclick="tambahKas()">💰 Tambah Kas</button>
            </div>

            <div class="form-group">
                <h4>Tambah Pengeluaran</h4>
                <input id="inputLokasi" placeholder="Lokasi/Keterangan">
                <input id="inputJumlahKeluar" type="number" placeholder="Jumlah">
                <button class="btn btn-primary" onclick="tambahPengeluaran()">💸 Pengeluaran</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const supabase = createClient(
    "https://tizsemvhdyykizevqsbl.supabase.co",
    "sb_publishable_ZzxxlCc_IGlHAaeo4OU7Jg_EL5Yhdeq"
)

let role = "anggota"
const loginSection = document.getElementById('loginSection')
const app = document.getElementById('app')
const adminPanel = document.getElementById('adminPanel')
const password = document.getElementById('password')

// Format Rupiah
const formatRupiah = (angka) => {
    return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0
    }).format(angka)
}

window.login = () => {
    if (password.value === "admin123") {
        role = "admin"
    } else if (!password.value) {
        return alert("⚠️ Password harus diisi!")
    }

    loginSection.classList.add('hidden')
    app.classList.remove('hidden')

    if (role === "admin") {
        adminPanel.classList.remove('hidden')
    }

    loadData()
    password.value = ''
}

// Load data utama
async function loadData() {
    try {
        // Anggota
        const { data: anggota } = await supabase.from("anggota").select("*")
        document.getElementById('selectAnggota').innerHTML = 
            (anggota || []).map(a => `<option value="${a.nama}">${a.nama}</option>`).join("")

        // Config saldo awal
        const { data: configList } = await supabase.from("config_kas").select("*")
        const config = configList?.[0] || { dana_awal: 0 }
        const saldoAwalValue = config.dana_awal || 0

        // Total pemasukan
        const { data: trx } = await supabase.from("transaksi_kas").select("jumlah")
        const totalMasukValue = (trx || []).reduce((sum, r) => sum + Number(r.jumlah), 0)

        // Total pengeluaran
        const { data: pengeluaran } = await supabase.from("pengeluaran").select("jumlah")
        const totalKeluarValue = (pengeluaran || []).reduce((sum, r) => sum + Number(r.jumlah), 0)

        const sisaKasValue = saldoAwalValue + totalMasukValue - totalKeluarValue

        // Update UI
        document.getElementById("saldoAwal").innerText = formatRupiah(saldoAwalValue)
        document.getElementById("totalMasuk").innerText = formatRupiah(totalMasukValue)
        document.getElementById("totalKeluar").innerText = formatRupiah(totalKeluarValue)
        document.getElementById("sisaKas").innerText = formatRupiah(sisaKasValue)

    } catch (error) {
        console.error('Error loading data:', error)
        alert('❌ Error loading data: ' + error.message)
    }
}

// Admin Actions
window.setSaldoAwal = async () => {
    if (role !== "admin") return alert("❌ Admin only!")
    
    const jumlah = Number(document.getElementById('inputSaldoAwal').value)
    if (!jumlah || jumlah < 0) return alert("⚠️ Masukkan jumlah yang valid!")

    try {
        await supabase.from("config_kas").upsert({ dana_awal: jumlah })
        alert("✅ Saldo awal disimpan!")
        document.getElementById('inputSaldoAwal').value = ''
        loadData()
    } catch (error) {
        alert("❌ Error: " + error.message)
    }
}

window.tambahAnggota = async () => {
    const nama = document.getElementById('inputNamaAnggota').value.trim()
    if (!nama) return alert("⚠️ Nama anggota harus diisi!")

    try {
        await supabase.from("anggota").insert({ nama })
        alert("✅ Anggota ditambahkan!")
        document.getElementById('inputNamaAnggota').value = ''
        loadData()
    } catch (error) {
        alert("❌ Error: " + error.message)
    }
}

window.tambahKas = async () => {
    const nama = document.getElementById('selectAnggota').value
    const jumlah = Number(document.getElementById('inputJumlahKas').value)
    
    if (!nama || !jumlah || jumlah <= 0) {
        return alert("⚠️ Pilih anggota dan masukkan jumlah yang valid!")
    }

    try {
        await supabase.from("transaksi_kas").insert({
            bulan: new Date().getMonth() + 1,
            tahun: new Date().getFullYear(),
            nama_anggota: nama,
            jumlah: jumlah,
            tanggal: new Date().toISOString()
        })
        alert("✅ Pemasukan ditambahkan!")
        document.getElementById('inputJumlahKas').value = ''
        loadData()
    } catch (error) {
        alert("❌ Error: " + error.message)
    }
}

window.tambahPengeluaran = async () => {
    const lokasi = document.getElementById('inputLokasi').value.trim()
    const jumlah = Number(document.getElementById('inputJumlahKeluar').value)
    
    if (!lokasi || !jumlah || jumlah <= 0) {
        return alert("⚠️ Isi keterangan dan jumlah yang valid!")
    }

    try {
        await supabase.from("pengeluaran").insert({
            lokasi: lokasi,
            tanggal: new Date().toISOString(),
            jumlah: jumlah
        })
        alert("✅ Pengeluaran ditambahkan!")
        document.getElementById('inputLokasi').value = ''
        document.getElementById('inputJumlahKeluar').value = ''
        loadData()
    } catch (error) {
        alert("❌ Error: " + error.message)
    }
}

// Realtime subscription
supabase.channel("realtime-kas")
    .on("postgres_changes", { event: "*", schema: "public", table: "transaksi_kas" }, loadData)
    .on("postgres_changes", { event: "*", schema: "public", table: "pengeluaran" }, loadData)
    .on("postgres_changes", { event: "*", schema: "public", table: "config_kas" }, loadData)
    .on("postgres_changes", { event: "*", schema: "public", table: "anggota" }, loadData)
    .subscribe()

// Keyboard shortcut untuk admin (Ctrl+Shift+A)
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && e.key === 'A') {
        role = 'admin'
        adminPanel.classList.remove('hidden')
    }
})
</script>

</body>
</html>
